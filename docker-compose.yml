services:
  intrams:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: ${APP_NAME:-Intramurals Management}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in Dokploy}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://slsubc.tech}
      APP_FORCE_HTTPS: "true"
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-intrams}
      DB_USERNAME: ${DB_USERNAME:-intrams}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      CACHE_DRIVER: file
      FILESYSTEM_DISK: public
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
      SESSION_DOMAIN: ${SESSION_DOMAIN:-slsubc.tech}
      SESSION_SECURE_COOKIE: "true"
      SESSION_LIFETIME: ${SESSION_LIFETIME:-240}
      INTRAMURALS_DEFAULT_ACCOUNT_PASSWORD: ${INTRAMURALS_DEFAULT_ACCOUNT_PASSWORD:-}
      DEPLOY_RUN_MIGRATIONS: ${DEPLOY_RUN_MIGRATIONS:-false}
      DEPLOY_SEED_DEFAULT_ACCOUNTS: ${DEPLOY_SEED_DEFAULT_ACCOUNTS:-false}
      DEPLOY_SEED_DEFAULT_COMPETITIONS: ${DEPLOY_SEED_DEFAULT_COMPETITIONS:-false}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - intrams_storage:/var/www/html/storage
      - intrams_bootstrap_cache:/var/www/html/bootstrap/cache

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-intrams}
      MYSQL_USER: ${DB_USERNAME:-intrams}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in Dokploy}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - intrams_mysql:/var/lib/mysql

volumes:
  intrams_storage:
  intrams_bootstrap_cache:
  intrams_mysql:
