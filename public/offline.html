<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#06152c">
        <title>Offline | SLSU INTRAMURALS</title>
        <link rel="manifest" href="/manifest.webmanifest">
        <link rel="icon" type="image/png" href="/icons/pwa-icon-192.png">
        <link rel="shortcut icon" type="image/png" href="/icons/pwa-icon-192.png">
        <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-icon-192.png">
        <link rel="icon" type="image/png" sizes="512x512" href="/icons/pwa-icon-512.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-icon-192.png">
        <style>
            :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
            * { box-sizing: border-box; }
            body {
                min-height: 100dvh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                color: #edf5ff;
                background:
                    linear-gradient(115deg, #020b1df7 0%, #06152cec 48%, #075133cc 100%),
                    #06152c;
            }
            main {
                width: min(100%, 520px);
                overflow: hidden;
                border: 1px solid #d8ecff2e;
                border-radius: 8px;
                background:
                    linear-gradient(145deg, #0b2440f2, #06172cee),
                    linear-gradient(90deg, #0c734526, transparent 42%, #d9b87d1f);
                box-shadow: 0 22px 54px #0006, inset 0 1px 0 #ffffff14;
            }
            .stripe { height: 4px; background: linear-gradient(90deg, #0c7345, #d9b87d, #0c7345); }
            .content { padding: 28px; }
            .brand { display: flex; align-items: center; gap: 12px; }
            .mark {
                width: 48px;
                height: 48px;
                object-fit: contain;
                filter: drop-shadow(0 8px 18px #0008);
            }
            h1 { margin: 24px 0 0; font-size: clamp(28px, 8vw, 42px); line-height: 1; }
            p { margin: 12px 0 0; color: #b4c6dc; line-height: 1.6; }
            a, button {
                display: inline-flex;
                margin-top: 24px;
                border: 0;
                border-radius: 8px;
                padding: 12px 16px;
                color: #06152c;
                background: #f0d49c;
                font: inherit;
                font-weight: 700;
                text-decoration: none;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="stripe" aria-hidden="true"></div>
            <div class="content">
                <div class="brand">
                    <img class="mark" src="/images/logo/main_logo.png" alt="" width="56" height="52">
                    <strong>SLSU INTRAMURALS</strong>
                </div>
                <h1>You are offline</h1>
                <p>The app shell is available, but this screen needs a network connection for fresh intramurals data and protected account actions.</p>
                <button type="button" onclick="location.reload()">Try again</button>
            </div>
        </main>
    </body>
</html>
